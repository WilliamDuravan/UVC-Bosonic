name: Build Boson APK

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (for sdkmanager only)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept SDK licenses and install platform/build-tools/NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-28" "build-tools;28.0.3" "ndk;21.4.7075529"

      - name: Strip unsupported <base-extension> metadata (old AGP can't parse schema v3)
        run: |
          python3 - <<'EOF'
          import re, glob, os
          sdk = os.environ['ANDROID_HOME']
          pattern = re.compile(r'<[\w:.-]*base-extension\b.*?</[\w:.-]*base-extension>', re.DOTALL)
          for path in glob.glob(os.path.join(sdk, '**', 'package.xml'), recursive=True):
              with open(path, 'r', encoding='utf-8') as f:
                  content = f.read()
              new_content = pattern.sub('', content)
              if new_content != content:
                  with open(path, 'w', encoding='utf-8') as f:
                      f.write(new_content)
                  print(f"Patched {path}")
          EOF

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/21.4.7075529" >> local.properties

      - name: Switch to JDK 8 (for the actual Gradle build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Install Gradle 3.3 directly (bypassing the broken wrapper jar)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '3.3'

      - name: Build Boson module APK
        run: gradle :usbCameraTest3:assembleDebug --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boson-debug-apk
          path: usbCameraTest3/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
