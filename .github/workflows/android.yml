name: Build Boson APK

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK platform, build-tools, and NDK
        run: |
          sdkmanager "platforms;android-28" "build-tools;28.0.3" "ndk;21.4.7075529"

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Boson module APK
        run: ./gradlew :usbCameraTest3:assembleDebug --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boson-debug-apk
          path: usbCameraTest3/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
